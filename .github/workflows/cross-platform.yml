name: 跨端验证

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 每一次 main 推送都必须保留自己的验证运行，避免快速连续推送时漏掉中间提交。
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.name }} 验证
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            native-build: windows
          - name: macOS
            os: macos-14
            native-build: macos

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 安装 JavaScript 依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 macOS 核心配置
        run: pnpm verify:macos

      - name: TypeScript 类型检查
        run: pnpm typecheck

      - name: 前端测试
        run: pnpm test

      - name: Rust 测试
        run: cargo test

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 前端构建
        run: pnpm build

      - name: Windows 原生打包
        if: matrix.native-build == 'windows'
        run: pnpm tauri build --bundles nsis

      - name: macOS 原生打包
        if: matrix.native-build == 'macos'
        run: pnpm tauri build --bundles app,dmg

      - name: 上传 Windows 安装包
        if: success() && matrix.native-build == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ai-reader-windows-${{ github.sha }}
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: 上传 macOS 构建产物
        if: success() && matrix.native-build == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ai-reader-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg

  ipados:
    name: iPadOS 原生验证
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Rust 与 iOS Simulator 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios-sim

      - name: 安装 JavaScript 依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 iPadOS 核心配置
        run: pnpm verify:ipados

      - name: TypeScript 类型检查
        run: pnpm typecheck

      - name: 前端测试
        run: pnpm test

      - name: Rust 测试
        run: cargo test

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 前端构建
        run: pnpm build

      - name: 生成并构建 iPadOS Simulator 原生应用
        working-directory: apps/reader
        run: |
          pnpm tauri ios init
          pnpm tauri ios build --debug --target aarch64-sim

      - name: 启动 iPadOS Simulator 并采集真实 WebView 证据
        working-directory: apps/reader
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPad/ { print $2; exit }')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          app_path="$(find src-tauri/gen/apple -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          mkdir -p "$RUNNER_TEMP/ai-reader-ipados-evidence"
          xcrun simctl launch --console "$device_id" com.buujuue.ai-reader > "$RUNNER_TEMP/ai-reader-ipados-evidence/launch.log" 2>&1
          sleep 5
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/ai-reader-ipados-evidence/ipados-webview.png"
          xcrun simctl shutdown "$device_id"

      - name: 上传 iPadOS 原生证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reader-ipados-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/ai-reader-ipados-evidence

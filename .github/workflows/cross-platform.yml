name: 跨端验证

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 每一次 main 推送都必须保留自己的验证运行，避免快速连续推送时漏掉中间提交。
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # TEMP(android-smoke): Android 模拟器稳定后恢复桌面验证。
    if: ${{ false }}
    name: ${{ matrix.name }} 验证
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            native-build: windows
          - name: macOS
            os: macos-14
            native-build: macos

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 安装 JavaScript 依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 macOS 核心配置
        run: pnpm verify:macos

      - name: TypeScript 类型检查
        run: pnpm typecheck

      - name: 前端测试
        run: pnpm test

      - name: Rust 测试
        run: cargo test

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 前端构建
        run: pnpm build

      - name: Windows 原生打包
        if: matrix.native-build == 'windows'
        run: pnpm tauri build --bundles nsis

      - name: macOS 原生打包
        if: matrix.native-build == 'macos'
        run: pnpm tauri build --bundles app,dmg

      - name: 上传 Windows 安装包
        if: success() && matrix.native-build == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ai-reader-windows-${{ github.sha }}
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: 上传 macOS 构建产物
        if: success() && matrix.native-build == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ai-reader-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg

  ipados:
    # TEMP(android-smoke): Android 模拟器稳定后恢复 iPadOS 验证。
    if: ${{ false }}
    name: iPadOS 原生验证
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_VERSION: '16.4'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化 iPadOS 证据目录
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/ai-reader-ipados-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' 'iPadOS evidence directory initialized' > "$evidence_dir/workflow-started.txt"

      - name: 选择兼容的 Xcode
        run: |
          set -euo pipefail
          xcode_path="/Applications/Xcode_${XCODE_VERSION}.app"
          test -d "$xcode_path"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version | tee "$RUNNER_TEMP/ai-reader-ipados-evidence/xcode-version.txt"

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Rust 与 iOS Simulator 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios-sim

      - name: 安装 JavaScript 依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 iPadOS 核心配置
        run: pnpm verify:ipados

      - name: TypeScript 类型检查
        run: pnpm typecheck

      - name: 前端测试
        run: pnpm test

      - name: Rust 测试
        run: cargo test

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 前端构建
        run: pnpm build

      - name: 生成并构建 iPadOS Simulator 原生应用
        working-directory: apps/reader
        run: |
          pnpm tauri ios init
          pnpm tauri ios build --debug --target aarch64-sim

      - name: 启动 iPadOS Simulator 并采集真实 WebView 证据
        working-directory: apps/reader
        run: |
          set -euo pipefail
          device_id="$(
            xcrun simctl list devices available |
              sed -nE '/iPad/ s/.*\(([0-9A-Fa-f-]{36})\).*/\1/p' |
              awk 'NR == 1 { value = $0 } END { if (value == "") exit 1; print value }'
          )"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          app_path="$(find src-tauri/gen/apple -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          evidence_dir="$RUNNER_TEMP/ai-reader-ipados-evidence"
          xcrun simctl launch "$device_id" com.buujuue.ai-reader > "$evidence_dir/launch.log" 2>&1
          sleep 5
          xcrun simctl io "$device_id" screenshot "$evidence_dir/ipados-webview.png"
          xcrun simctl shutdown "$device_id"

      - name: 上传 iPadOS 原生证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-reader-ipados-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/ai-reader-ipados-evidence

  android:
    name: Android tablet 原生验证
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化 Android 证据目录
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/ai-reader-android-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' 'Android tablet evidence directory initialized' > "$evidence_dir/workflow-started.txt"

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          if ! sudo udevadm control --reload-rules; then
            echo '::warning::Unable to reload udev rules; checking the existing KVM device directly.'
          fi
          if ! sudo udevadm trigger --name-match=kvm; then
            echo '::warning::Unable to trigger the KVM udev rule; checking the existing KVM device directly.'
          fi
          if [ ! -e /dev/kvm ]; then
            echo '::error::This runner does not expose /dev/kvm; use a GitHub-hosted Linux runner with Android hardware acceleration.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: 配置 Rust Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 JavaScript 依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 Android 核心配置
        run: pnpm verify:android

      - name: TypeScript 类型检查
        if: ${{ false }} # TEMP(android-smoke)
        run: pnpm typecheck

      - name: 前端测试
        if: ${{ false }} # TEMP(android-smoke)
        run: pnpm test

      - name: Rust 测试
        if: ${{ false }} # TEMP(android-smoke)
        run: cargo test

      - name: Rust Clippy
        if: ${{ false }} # TEMP(android-smoke)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 前端构建
        if: ${{ false }} # TEMP(android-smoke); Tauri build 会执行 beforeBuildCommand
        run: pnpm build

      - name: 生成 Android 原生工程
        working-directory: apps/reader
        run: pnpm tauri android init --ci --skip-targets-install

      - name: 构建 Android debug APK
        working-directory: apps/reader
        run: pnpm tauri android build --debug --target x86_64 --apk

      - name: 释放 Android 构建进程并记录资源
        run: |
          set -euo pipefail
          apps/reader/src-tauri/gen/android/gradlew --stop || true
          free -h
          ps -eo pid,ppid,rss,%mem,%cpu,comm --sort=-rss | sed -n '1,20p'

      - name: 启动 Android 平板模拟器并采集真实 WebView 证据
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ai-reader-android-evidence
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 1536M
          heap-size: 256M
          disable-linux-hw-accel: false
          script: bash .github/scripts/android-emulator-smoke.sh

      - name: 上传 Android 原生证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-reader-android-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/ai-reader-android-evidence

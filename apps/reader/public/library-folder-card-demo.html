<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Reader · VS Code 书库树演示</title>
    <style>
      :root {
        color-scheme: dark;
        --workbench: #1b1e24;
        --bar: rgb(31 35 43 / 92%);
        --panel: rgb(35 39 48 / 92%);
        --panel-deep: rgb(27 30 37 / 96%);
        --hover: rgb(255 255 255 / 7%);
        --selected: rgb(99 108 176 / 27%);
        --line: rgb(255 255 255 / 9%);
        --text: #e4e7ed;
        --muted: #9ba1ad;
        --dim: #737a87;
        --blue: #86a9ff;
        --folder: #d4ae72;
        font-family: "Segoe UI", Inter, "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 900px; min-height: 100%; margin: 0; }
      body {
        color: var(--text);
        background:
          radial-gradient(ellipse 70% 80% at 0% 8%, rgb(75 89 140 / 15%), transparent 68%),
          radial-gradient(ellipse 60% 70% at 100% 72%, rgb(96 70 130 / 12%), transparent 70%),
          var(--workbench);
        font-size: 13px;
      }
      button { color: inherit; font: inherit; }
      .window { width: min(1400px, calc(100vw - 32px)); min-height: 760px; margin: 16px auto; overflow: hidden; border: 1px solid rgb(255 255 255 / 12%); border-radius: 12px; background: var(--workbench); box-shadow: 0 30px 90px rgb(0 0 0 / 38%); }

      .titlebar { display: flex; align-items: center; height: 48px; padding: 0 14px; gap: 18px; border-bottom: 1px solid var(--line); background: var(--bar); }
      .brand { display: flex; align-items: center; gap: 9px; min-width: 178px; color: #f0f2f6; font-weight: 600; }
      .brand-mark { display: grid; width: 22px; height: 22px; place-items: center; color: #aac2ff; border: 1px solid rgb(145 172 255 / 26%); border-radius: 5px; background: rgb(110 135 222 / 18%); }
      .menus { display: flex; align-items: center; gap: 2px; }
      .menu { padding: 6px 10px; border: 0; border-radius: 5px; color: var(--muted); background: transparent; cursor: pointer; }
      .menu:hover { color: var(--text); background: var(--hover); }
      .window-name { margin-left: auto; color: var(--dim); font-size: 12px; }
      .window-actions { display: flex; gap: 4px; margin-left: 14px; }
      .window-actions button, .icon-button { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 5px; color: var(--muted); background: transparent; cursor: pointer; }
      .window-actions button:hover, .icon-button:hover { color: var(--text); background: var(--hover); }

      .workbench { display: grid; grid-template-columns: 52px minmax(240px, 320px) 1fr 260px; min-height: 710px; }
      .activitybar { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; border-right: 1px solid var(--line); background: rgb(28 31 38 / 94%); }
      .activity-button { position: relative; display: grid; width: 42px; height: 42px; place-items: center; border: 0; border-radius: 7px; color: var(--dim); background: transparent; cursor: pointer; }
      .activity-button:hover { color: var(--text); background: var(--hover); }
      .activity-button.active { color: var(--text); background: var(--selected); }
      .activity-button.active::before { position: absolute; left: -5px; width: 2px; height: 24px; content: ""; border-radius: 0 2px 2px 0; background: var(--blue); }
      .activity-spacer { flex: 1; }

      .sidebar { position: relative; min-width: 0; border-right: 1px solid var(--line); background: var(--panel); }
      .sidebar-head { display: flex; align-items: center; justify-content: space-between; height: 45px; padding: 0 12px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
      .sidebar-head strong { color: var(--text); font-size: 12px; font-weight: 600; }
      .sidebar-actions { display: flex; gap: 2px; }
      .resize-handle { position: absolute; top: 0; right: -3px; z-index: 3; width: 6px; height: 100%; cursor: col-resize; }
      .resize-handle:hover { background: rgb(134 169 255 / 45%); }
      .explorer { height: calc(100% - 45px); overflow: auto; padding: 4px 7px 20px; }
      .section-heading { display: flex; align-items: center; gap: 5px; padding: 7px 7px 6px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
      .section-heading svg { color: var(--dim); transition: transform 120ms ease; }
      .section-heading.collapsed svg { transform: rotate(-90deg); }
      .tree { display: grid; gap: 1px; }
      .tree-row { display: flex; align-items: center; width: 100%; min-height: 27px; gap: 4px; padding: 3px 6px 3px 4px; border: 0; border-radius: 4px; color: var(--muted); background: transparent; text-align: left; cursor: pointer; }
      .tree-row:hover { color: var(--text); background: var(--hover); }
      .tree-row.selected { color: #fff; background: var(--selected); }
      .tree-row .chevron { display: grid; width: 15px; height: 18px; place-items: center; color: var(--dim); }
      .tree-row .chevron.open svg { transform: rotate(90deg); }
      .tree-row.book .node-icon { color: #aeb7c6; }
      .tree-row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tree-row .count { margin-left: auto; color: var(--dim); font-size: 10px; }
      .tree-children { display: grid; }
      .context-menu { position: fixed; z-index: 10; display: none; min-width: 178px; padding: 5px; border: 1px solid rgb(255 255 255 / 14%); border-radius: 6px; background: #292d36; box-shadow: 0 12px 30px rgb(0 0 0 / 42%); }
      .context-menu.open { display: grid; }
      .context-menu button { padding: 7px 9px; border: 0; border-radius: 4px; color: var(--text); background: transparent; text-align: left; cursor: pointer; }
      .context-menu button:hover { background: rgb(134 169 255 / 18%); }

      .editor { min-width: 0; background: #1d2026; }
      .tabs { display: flex; align-items: end; height: 39px; overflow: hidden; border-bottom: 1px solid var(--line); background: #191c21; }
      .tab { display: flex; align-items: center; gap: 7px; min-width: 150px; height: 39px; padding: 0 13px; border-right: 1px solid var(--line); color: var(--muted); background: #20242b; font-size: 12px; }
      .tab.active { color: var(--text); background: #1d2026; }
      .tab svg { color: #b6c0d3; }
      .editor-content { max-width: 780px; margin: 0 auto; padding: 52px 54px; }
      .path { color: var(--dim); font-size: 11px; }
      .editor-content h1 { margin: 12px 0 8px; color: #f1f3f7; font-size: 26px; font-weight: 600; letter-spacing: -.03em; }
      .editor-content .author { margin: 0 0 32px; color: var(--muted); }
      .reader-card { padding: 22px 24px; border: 1px solid var(--line); border-radius: 8px; background: rgb(255 255 255 / 3%); }
      .reader-card p { margin: 0 0 15px; color: #c4c9d2; line-height: 1.8; }
      .reader-card p:last-child { margin-bottom: 0; }
      .annotation { border-bottom: 1px solid rgb(156 179 255 / 62%); color: #d7ddff; cursor: pointer; }
      .annotation:hover { background: rgb(134 169 255 / 14%); }

      .agent { min-width: 0; border-left: 1px solid var(--line); background: var(--panel-deep); }
      .agent-head { display: flex; align-items: center; height: 45px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
      .agent-empty { display: grid; height: calc(100% - 45px); place-items: center; padding: 22px; text-align: center; }
      .agent-empty div { max-width: 180px; color: var(--dim); line-height: 1.7; }
      .agent-empty svg { margin-bottom: 12px; color: #7285b6; }
      .statusbar { display: flex; align-items: center; justify-content: space-between; height: 25px; padding: 0 12px; color: #bbc4d6; background: #3d4c7a; font-size: 11px; }
      .statusbar span { margin-right: 16px; }

      @media (max-width: 1100px) { .workbench { grid-template-columns: 48px minmax(230px, 280px) 1fr; } .agent { display: none; } }
      @media (max-width: 820px) { html, body { min-width: 0; } .window { width: calc(100vw - 16px); margin: 8px auto; } .workbench { grid-template-columns: 44px minmax(215px, 260px) 1fr; } .window-name { display: none; } .editor-content { padding: 34px 24px; } }
    </style>
  </head>
  <body>
    <div class="window">
      <header class="titlebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.8A2.8 2.8 0 0 1 7.8 2H19v16.2A2.8 2.8 0 0 0 16.2 21H5V4.8Z"/><path d="M5 18.2A2.8 2.8 0 0 1 7.8 15H19"/></svg></span><span>AI Reader</span></div>
        <nav class="menus" aria-label="应用菜单"><button class="menu" type="button">文件</button><button class="menu" type="button">编辑</button><button class="menu" type="button">视图</button><button class="menu" type="button">帮助</button></nav>
        <span class="window-name">书库 · 工作区</span>
        <div class="window-actions"><button type="button" aria-label="最小化">−</button><button type="button" aria-label="最大化">□</button><button type="button" aria-label="关闭">×</button></div>
      </header>

      <div class="workbench">
        <aside class="activitybar" aria-label="活动栏">
          <button class="activity-button active" type="button" aria-label="书库"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A2.5 2.5 0 0 0 17.5 16H4V5.5Z"/><path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21H20"/></svg></button>
          <button class="activity-button" type="button" aria-label="目录"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
          <button class="activity-button" type="button" aria-label="搜索"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m16 16 4.2 4.2"/></svg></button>
          <span class="activity-spacer"></span>
          <button class="activity-button" type="button" aria-label="设置"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 15 .8 1.8-2.2 2.2-1.8-.8-1.5.6-.8 1.8h-3.1L10 18.8l-1.5-.6-1.8.8-2.2-2.2.8-1.8-.6-1.5-1.8-.8V11.6l1.8-.8.6-1.5-.8-1.8 2.2-2.2 1.8.8L10 5.5l.8-1.8h3.1l.8 1.8 1.5.6 1.8-.8 2.2 2.2-.8 1.8.6 1.5 1.8.8v3.1l-1.8.8-.6 1.5Z"/></svg></button>
        </aside>

        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head"><strong>资源管理器</strong><div class="sidebar-actions"><button class="icon-button" id="new-folder" type="button" aria-label="新建文件夹">＋</button><button class="icon-button" id="collapse-all" type="button" aria-label="全部折叠">⌃</button><button class="icon-button" type="button" aria-label="更多操作">···</button></div></div>
          <div class="explorer">
            <button class="section-heading" id="section-toggle" type="button"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span>书库</span></button>
            <div class="tree" id="tree" aria-label="书库文件夹树"></div>
          </div>
          <span class="resize-handle" id="resize-handle" aria-label="拖动调整侧栏宽度"></span>
        </aside>

        <main class="editor" aria-label="阅读工作区">
          <div class="tabs"><div class="tab active" id="tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg><span>选择一本书</span></div></div>
          <article class="editor-content" id="editor-content"><p class="path">书库 / 工作区</p><h1>选择一本书开始阅读</h1><p class="author">VS Code 风格的树形书库</p><div class="reader-card"><p>左侧资源管理器就是书库。文件夹可展开、折叠和嵌套，书籍在文件夹下只显示书名，不显示封面。</p><p>点击书名打开阅读标签；点击书中的 <span class="annotation">标注文字</span> 可模拟查看对应批注。</p></div></article>
        </main>

        <aside class="agent"><div class="agent-head">Agent</div><div class="agent-empty"><div><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v3M6.8 7.2 4.7 5.1M17.2 7.2l2.1-2.1M4 13h3M17 13h3M7.4 18.2 5.3 20.3M16.6 18.2l2.1 2.1"/><circle cx="12" cy="13" r="5"/></svg><br />右侧栏暂留给未来的 Agent 交互能力</div></div></aside>
      </div>
      <footer class="statusbar"><div><span>● 就绪</span><span>书库树</span></div><div><span>UTF-8</span><span>本地工作区</span></div></footer>
    </div>
    <div class="context-menu" id="context-menu"><button id="context-new-folder" type="button">新建子文件夹</button><button id="context-rename" type="button">重命名</button><button id="context-delete" type="button">删除（演示）</button></div>

    <script>
      const folder = (id, name, children = [], books = []) => ({ id, name, children, books, expanded: true });
      const book = (id, title, author) => ({ id, title, author });
      const library = folder('root', '书库', [
        folder('history', '文史哲', [folder('europe', '欧洲史', [folder('modern', '近代欧洲', [folder('revolution', '法国大革命', [], [book('tocqueville', '旧制度与大革命', '托克维尔'), book('revolution-history', '法国大革命史', '乔治·勒费弗尔')])])])]),
        folder('technology', '技术与工具', [folder('frontend', '前端工程', [], [book('typescript', 'TypeScript 深入理解', '技术资料'), book('design-system', '设计系统工作手册', '团队资料')])]),
        folder('inbox', '待读', [], [book('sapiens', '人类简史', '尤瓦尔·赫拉利')]),
      ]);

      const state = { selected: null, collapsed: false, folderCounter: 0, contextFolder: null };
      const find = (node, id) => node.id === id ? node : node.children.map((child) => find(child, id)).find(Boolean);
      const depth = (node, id, level = 1) => node.id === id ? level : node.children.map((child) => depth(child, id, level + 1)).find(Boolean);
      const chevron = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>';
      const bookIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg>';

      function rows(node, level = 0) {
        const isRoot = level === 0;
        const open = !state.collapsed && node.expanded;
        const hasChildren = node.children.length > 0 || node.books.length > 0;
        const selected = state.selected === node.id ? ' selected' : '';
        let html = `<button class="tree-row${selected}" type="button" data-kind="folder" data-id="${node.id}" style="padding-left:${4 + level * 6}px"><span class="chevron${open ? ' open' : ''}">${hasChildren ? chevron : ''}</span><span class="name">${node.name}</span>${isRoot ? '' : `<span class="count">${node.children.length + node.books.length}</span>`}</button>`;
        if (open) {
          html += `<div class="tree-children">${node.children.map((child) => rows(child, level + 1)).join('')}${node.books.map((item) => `<button class="tree-row book${state.selected === item.id ? ' selected' : ''}" type="button" data-kind="book" data-id="${item.id}" style="padding-left:${12 + level * 6}px"><span class="chevron"></span><span class="node-icon">${bookIcon}</span><span class="name">${item.title}</span></button>`).join('')}</div>`;
        }
        return html;
      }

      function render() {
        document.querySelector('#tree').innerHTML = rows(library);
        document.querySelectorAll('.tree-row').forEach((row) => {
          row.addEventListener('click', () => select(row.dataset.kind, row.dataset.id));
          row.addEventListener('contextmenu', (event) => { event.preventDefault(); if (row.dataset.kind === 'folder') openContext(event, find(library, row.dataset.id)); });
        });
      }
      function select(kind, id) {
        state.selected = id;
        if (kind === 'folder') { const node = find(library, id); node.expanded = !node.expanded; showFolder(node); }
        else { const result = findBook(library, id); showBook(result.book, result.parent); }
        render();
      }
      function findBook(node, id) { const bookMatch = node.books.find((item) => item.id === id); if (bookMatch) return { book: bookMatch, parent: node }; for (const child of node.children) { const result = findBook(child, id); if (result) return result; } return null; }
      function showFolder(node) { document.querySelector('#tab span').textContent = node.name; document.querySelector('#editor-content').innerHTML = `<p class="path">书库 / ${node.name}</p><h1>${node.name}</h1><p class="author">文件夹 · ${node.children.length} 个子文件夹 · ${node.books.length} 本书</p><div class="reader-card"><p>这是 <strong>${node.name}</strong> 文件夹。继续展开左侧树即可进入下一层。</p><p>文件夹层级最多 5 层；书籍始终以树节点显示，不展示封面。</p></div>`; }
      function showBook(item, parent) { document.querySelector('#tab span').textContent = item.title; document.querySelector('#editor-content').innerHTML = `<p class="path">书库 / ${parent.name} / ${item.title}</p><h1>${item.title}</h1><p class="author">${item.author}</p><div class="reader-card"><p>这是阅读工作区示意。正文、选区和批注都在当前书籍工作区内完成。</p><p>点击 <span class="annotation" title="批注：这是一个示例批注">标注文字</span> 查看对应批注。</p></div>`; }
      function createFolder(parent) { if (!parent || depth(library, parent.id) >= 5) { alert('文件夹最多支持 5 层'); return; } const name = prompt('新建子文件夹名称'); if (!name || !name.trim()) return; parent.children.push(folder(`new-${++state.folderCounter}`, name.trim())); parent.expanded = true; closeContext(); render(); }
      function openContext(event, node) { state.contextFolder = node; const menu = document.querySelector('#context-menu'); menu.style.left = `${Math.min(event.clientX, window.innerWidth - 196)}px`; menu.style.top = `${Math.min(event.clientY, window.innerHeight - 140)}px`; menu.classList.add('open'); }
      function closeContext() { document.querySelector('#context-menu').classList.remove('open'); state.contextFolder = null; }

      document.querySelector('#new-folder').addEventListener('click', () => createFolder(find(library, state.selected) || library));
      document.querySelector('#collapse-all').addEventListener('click', () => { state.collapsed = !state.collapsed; document.querySelector('#collapse-all').textContent = state.collapsed ? '⌄' : '⌃'; render(); });
      document.querySelector('#section-toggle').addEventListener('click', () => { state.collapsed = !state.collapsed; document.querySelector('#section-toggle').classList.toggle('collapsed', state.collapsed); render(); });
      document.querySelector('#context-new-folder').addEventListener('click', () => createFolder(state.contextFolder));
      document.querySelector('#context-rename').addEventListener('click', () => { if (state.contextFolder) { const name = prompt('重命名文件夹', state.contextFolder.name); if (name && name.trim()) state.contextFolder.name = name.trim(); } closeContext(); render(); });
      document.querySelector('#context-delete').addEventListener('click', () => { alert('删除仅作交互演示，未执行实际删除。'); closeContext(); });
      document.addEventListener('click', (event) => { if (!event.target.closest('.context-menu')) closeContext(); });
      document.querySelectorAll('.activity-button').forEach((button, index) => button.addEventListener('click', () => { if (index < 3) { document.querySelectorAll('.activity-button').forEach((item) => item.classList.remove('active')); button.classList.add('active'); } }));

      const sidebar = document.querySelector('#sidebar');
      const handle = document.querySelector('#resize-handle');
      let resizing = false;
      handle.addEventListener('pointerdown', (event) => { resizing = true; handle.setPointerCapture(event.pointerId); document.body.style.cursor = 'col-resize'; });
      handle.addEventListener('pointermove', (event) => { if (!resizing) return; const rect = sidebar.getBoundingClientRect(); const width = Math.max(220, Math.min(440, event.clientX - rect.left)); sidebar.style.width = `${width}px`; sidebar.style.minWidth = `${width}px`; });
      handle.addEventListener('pointerup', () => { resizing = false; document.body.style.cursor = ''; });
      render();
    </script>
  </body>
</html>

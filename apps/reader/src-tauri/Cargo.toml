[package]
name = "ai-reader"
version = "0.1.0"
description = "AI Reader 跨端本地阅读器"
authors = ["buujuue"]
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "ai_reader_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
